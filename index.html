<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RAFFICA!">
  <title>RAFFICA! Party</title>
  <!-- Installable app (PWA): manifest + icons; iPhone uses apple-touch-icon ("Aggiungi a Home"). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- Fonts are vendored (OFL): the game works offline on the LAN. -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js addons (GLTFLoader, SkeletonUtils) import the bare specifier "three". -->
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="game3d"></canvas>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <button id="pauseBtn" class="pause-btn hidden" aria-label="Pausa">❚❚</button>
  <div id="toast" class="toast hidden"></div>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/client/main.js"></script>
</body>
</html>
